[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "reviewctl"
version = "0.3.1"
description = "Portable, evidence-backed LLM code review control plane"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Lufebac Software" }]
dependencies = []

[project.scripts]
reviewctl = "reviewctl.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.15,<0.16"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/reviewctl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess"]
source = ["reviewctl"]

[tool.coverage.report]
fail_under = 100
show_missing = true
